<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Toast Notifications</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="buttons">
        <button onclick="showToast(successMsg)">Success</button>
        <button onclick="showToast(errorMsg)">Error</button>
        <button onclick="showToast(invalidMsg)">Invalid</button>
    </div>
    <div id="toast_box">

    </div>
    <script>
    let toast_box=document.getElementById('toast_box');
    let successMsg="Successfully submitted";
    let errorMsg="Please fix error";
    let invalidMsg="Invalid input,try again";
    function showToast(msg){
        let toast=document.createElement('div');
        toast.classList.add('toast');
        toast.innerHTML=msg;
        toast_box.appendChild(toast);
        if(msg.includes('error')){
            toast.classList.add('error')
        }
        if(msg.includes('Invalid')){
            toast.classList.add('Invalid')
        }
        setTimeout(() => {
            toast.remove();
        },6000);
    }


</script>
</body>
</html>
